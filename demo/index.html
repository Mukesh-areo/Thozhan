<!doctype html>
<html lang="ta">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#123e32" />
    <meta name="application-name" content="Thozhan" />
    <meta name="apple-mobile-web-app-title" content="Thozhan" />
    <title>Thozhan — Your city, your ride</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body>
    <aside>
      <a class="brand" href="#"
        ><span class="logo">t<span>↗</span></span
        >Thozhan<span class="brand-small" id="brand-small">MOBILITY</span></a
      >
      <div class="workspace-label" id="workspace-label">YOUR WORKSPACE</div>
      <nav id="nav"></nav>
      <div class="aside-bottom">
        <div class="leaf">✳</div>
        <strong id="aside-title">A better way to move.</strong>
        <p id="aside-body">Built around our people. Made for Tamil Nadu.</p>
        <span class="pilot-dot" id="pilot-dot">Chennai pilot</span>
      </div>
      <div class="profile">
        <span class="avatar">AK</span>
        <div><strong>Arun Kumar</strong><small id="profile-note">Demo account</small></div>
      </div>
    </aside>
    <div class="shell">
      <header>
        <div><span class="location-dot"></span> <span id="location-name">Chennai, Tamil Nadu</span></div>
        <div class="header-right">
          <span class="demo" id="demo-pill">INTERACTIVE DEMO</span
          ><button id="lang" class="lang-button" aria-label="Switch language / மொழியை மாற்று">English</button
          ><button id="help" class="icon-button" aria-label="Open help">?</button>
        </div>
      </header>
      <main id="app"></main>
      <footer>
        <span id="footer-main">Designed for everyday journeys.</span> <span id="footer-note">Demo rides · No real dispatch or payments</span>
      </footer>
    </div>
    <dialog id="dialog">
      <div id="dialog-body"></div>
      <button class="primary" id="close-dialog">Got it</button>
    </dialog>
    <div id="toast" role="status"></div>
    <script src="app.js"></script>
  </body>
</html>
