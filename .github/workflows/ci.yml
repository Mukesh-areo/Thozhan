name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Check the committed web bundle is up to date
        run: npm run build:web && git diff --exit-code web/app.js
      - run: npm run test:web

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check the edge functions
        run: |
          for config in supabase/functions/*/deno.json; do
            deno check --config "$config" "$(dirname "$config")/index.ts"
          done

  apps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck:apps
      - run: npm run build:admin
      - name: Bundle the Android app
        working-directory: apps/mobile
        run: npx expo export --platform android --output-dir /tmp/expo-android
